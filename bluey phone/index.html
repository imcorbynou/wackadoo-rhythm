<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#a6dcff">
  <meta name="description" content="Save your Keepy Uppy photo with Bluey and Bingo.">
  <title>Wackadoo Rhythm! (Bluey X Deaf Connect)</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <main class="phone-page">
    <img class="brand" src="assets/logo%20name.png" alt="Bluey × Deaf Connect" width="1161" height="470">
    <h1><img src="assets/Great%20job%20playing%20Keepy%20Uppy!.png" alt="Great job playing Keepy Uppy!" width="1271" height="285"></h1>
    <div class="photo-frame">
      <img id="photo-placeholder" src="assets/polaroid.png" alt="Your photo with Bluey and Bingo will appear here" width="1511" height="1566">
      <img id="photo" alt="Your celebration photo with Bluey and Bingo" width="1511" height="1566" hidden>
    </div>
    <p class="invitation"><img src="assets/Go%20ahead%20and%20download%20your%20photo%20with%20Bluey%20and%20Bingo!.png" alt="Go ahead and download your photo with Bluey and Bingo!" width="1254" height="283"></p>
    <button id="save-photo" type="button" disabled><img src="assets/button.png" alt="Save photo" width="936" height="200"></button>
    <p id="photo-status" role="status" aria-live="polite">Waiting for your photo…</p>
  </main>
</body>
</html>
